<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Agents Web Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b, #334155);
      color: #ffffff;
      overflow: hidden;
    }

    .bg-blur {
      position: absolute;
      width: 300px;
      height: 300px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.5;
    }

    .bg-blur.one {
      background: #38bdf8;
      top: 10%;
      left: 15%;
    }

    .bg-blur.two {
      background: #a855f7;
      bottom: 10%;
      right: 15%;
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(90%, 700px);
      padding: 48px 32px;
      text-align: center;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
    }

    .greeting {
      font-size: 1rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 14px;
    }

    h1 {
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 14px;
    }

    p {
      font-size: 1rem;
      color: rgba(255, 255, 255, 0.75);
    }
  </style>
</head>
<body>
  <div class="bg-blur one"></div>
  <div class="bg-blur two"></div>

  <div class="card">
    <div class="greeting">Hello Dosto</div>
    <h1>Welcome to AI Agents Web Page</h1>
    <p>A minimal glass morph UI for your modern web experience.</p>
  </div>
</body>
</html>
